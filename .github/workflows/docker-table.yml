name: Build & publish the table image

# ghcr.io/<owner>/nmuch-table (the battle map table server). It is built only
# when a push to main changes something the table server is made from; v* tags
# and a manual run (Actions -> Run workflow) always build it.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - crates/bw-table/**
      - apps/table/**
      - deploy/table/Dockerfile
      - Cargo.toml
      - Cargo.lock
      - .dockerignore
      - .github/workflows/docker-table.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: nmuch-table
            dockerfile: deploy/table/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
