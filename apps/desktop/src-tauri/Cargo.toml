[package]
name = "nimbus"
version = "0.1.0"
description = "Local-first block-based notes"
edition = "2021"

[lib]
name = "nimbus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
bw-core = { path = "../../../crates/bw-core" }
bw-api = { path = "../../../crates/bw-api" }
