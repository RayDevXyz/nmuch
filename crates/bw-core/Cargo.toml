[package]
name = "bw-core"
version = "0.1.0"
edition = "2021"
description = "BrainWaves core spike: block model, yrs persistence, SQLite index rebuild"
publish = false

[dependencies]
yrs = "0.28"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
