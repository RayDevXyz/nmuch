[package]
name = "bw-devserver"
version = "0.1.0"
edition = "2021"
description = "Serves bw-api over HTTP so the UI can run in a plain browser during development"
publish = false

[dependencies]
bw-core = { path = "../bw-core" }
bw-api = { path = "../bw-api" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
serde_json = "1"
