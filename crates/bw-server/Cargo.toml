[package]
name = "bw-server"
version = "0.1.0"
edition = "2021"
description = "BrainWaves as a hosted web app: the core, its API, a login, and the web app itself"
publish = false

[dependencies]
bw-core = { path = "../bw-core" }
bw-api = { path = "../bw-api" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
