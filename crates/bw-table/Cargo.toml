[package]
name = "bw-table"
version = "0.1.0"
edition = "2021"
description = "BrainWaves table server: players see the DM's battle maps live, ping, draw, request moves and roll dice"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
rand = "0.8"
base64 = "0.22"
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
