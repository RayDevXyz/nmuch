<!doctype html>
<html>
<head>
<!--
  Folder index: an example BrainWaves module (see docs/modules.md).
  Install it in Settings → Modules → Install from file, approve it, then type /folder in a page.
-->
<script type="application/bw-module+json">
{
  "id": "example.folder-index",
  "name": "Folder index",
  "description": "Lists a folder you choose, live, and can save it as a database.",
  "version": "1",
  "icon": "🗂️",
  "namespace": "folderindex",
  "capabilities": ["fs.pick", "fs.open", "db.own"]
}
</script>
<style>
  .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  button { padding: 5px 10px; border-radius: 7px; border: 1px solid var(--bw-line); background: var(--bw-panel); cursor: pointer; }
  button.primary { background: var(--bw-accent); color: var(--bw-accent-ink, #1b1528); border-color: transparent; font-weight: 600; }
  .path { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--bw-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .kinds { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .kind { font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--bw-panel-2); color: var(--bw-muted); }
  ul { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow: auto; }
  li { display: flex; gap: 8px; padding: 2px 4px; border-radius: 5px; cursor: pointer; }
  li:hover { background: var(--bw-panel-2); }
  li .size { margin-left: auto; color: var(--bw-faint); font-variant-numeric: tabular-nums; font-size: 12px; }
  .err { color: var(--bw-danger); font-size: 12px; }
  .muted { color: var(--bw-faint); }
</style>
</head>
<body>
<div class="bar">
  <button id="pick" class="primary">Choose folder…</button>
  <span id="path" class="path muted">No folder yet</span>
  <button id="save" hidden>Save as database</button>
</div>
<div id="kinds" class="kinds"></div>
<ul id="list"></ul>
<div id="err" class="err"></div>
<script>
  const $ = (id) => document.getElementById(id)
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
  const size = (n) => (n > 1e9 ? (n / 1e9).toFixed(1) + ' GB' : n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : n > 1e3 ? Math.round(n / 1e3) + ' KB' : n + ' B')
  const fail = (e) => ($('err').textContent = e.message || String(e))
  let files = []

  async function show() {
    const folder = bw.settings.folder
    $('path').textContent = folder || 'No folder yet'
    $('path').classList.toggle('muted', !folder)
    $('save').hidden = !folder || !bw.editable
    if (!folder) return
    try {
      files = (await bw.fs.list(folder, { recursive: true })).filter((e) => !e.isDir)
      $('err').textContent = ''
    } catch (e) {
      files = []
      return fail(e)
    }
    const kinds = {}
    for (const f of files) {
      const ext = f.name.includes('.') ? f.name.split('.').pop().toLowerCase() : '—'
      kinds[ext] = (kinds[ext] || 0) + 1
    }
    $('kinds').innerHTML = `<span class="kind">${files.length} files</span>` + Object.entries(kinds).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<span class="kind">${esc(k)} · ${n}</span>`).join('')
    $('list').innerHTML = files.slice(0, 300).map((f) => `<li data-path="${esc(f.path)}"><span>${esc(f.rel)}</span><span class="size">${size(f.size)}</span></li>`).join('')
  }

  $('pick').onclick = async () => {
    try {
      const folder = await bw.fs.pickFolder('Choose a folder to index')
      if (folder) await bw.setSettings({ ...bw.settings, folder })
    } catch (e) { fail(e) }
  }
  $('list').onclick = (e) => {
    const li = e.target.closest('li')
    if (li) bw.fs.open(li.dataset.path).catch(fail)
  }
  $('save').onclick = async () => {
    try {
      const db = await bw.db.create({ title: 'Files in ' + bw.settings.folder.split(/[\\/]/).pop(), icon: '🗂️' })
      await bw.db.setProperty(db, { id: 'size', name: 'Size (KB)', type: 'number' })
      await bw.db.setProperty(db, { id: 'path', name: 'Path', type: 'file' })
      for (const f of files.slice(0, 500)) await bw.db.createRow(db, f.rel, { size: Math.round(f.size / 1024), path: f.path })
      bw.openPage(db)
    } catch (e) { fail(e) }
  }

  bw.ready.then(() => {
    $('pick').hidden = !bw.editable
    show()
    bw.onSettings(show)
    bw.fs.onChange(show)
  })
</script>
</body>
</html>
